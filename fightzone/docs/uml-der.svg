<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama entidade-relacionamento da FightZone</title>
  <desc id="desc">Oito tabelas relacionadas para contas, clientes, categorias, produtos, pedidos, itens, estoque e notas fiscais.</desc>
  <defs>
    <style>
      .bg{fill:#f4f1eb}.box{fill:#fffefa;stroke:#171816;stroke-width:2}.head{fill:#171816}.headtxt{fill:#fffefa;font:bold 20px Arial,sans-serif}.field{fill:#252a32;font:15px Arial,sans-serif}.title{fill:#171816;font:bold 28px Arial,sans-serif}.line{fill:none;stroke:#d8432e;stroke-width:3}.rel{fill:#a92d20;font:bold 14px Arial,sans-serif}.tag{fill:#fffefa;stroke:#d8432e;stroke-width:1.5}
    </style>
  </defs>
  <rect class="bg" width="1500" height="1120" rx="20"/>
  <text class="title" x="750" y="46" text-anchor="middle">FightZone • Diagrama entidade-relacionamento (DER)</text>
  <g class="line">
    <path d="M245 300V410"/>
    <path d="M410 155H510V330H650V390"/>
    <path d="M900 165H1080"/>
    <path d="M1255 340V420"/>
    <path d="M970 525H1080"/>
    <path d="M770 665V810"/>
    <path d="M80 170H58V900H80"/>
    <path d="M1080 290H1030V750H480V900"/>
  </g>
  <g class="rel">
    <text x="258" y="365">1 : 0..1</text>
    <text x="515" y="315">1 : N</text>
    <text x="985" y="153">1 : N</text>
    <text x="1265" y="390">1 : N</text>
    <text x="985" y="510">1 : N</text>
    <text x="785" y="744">1 : 0..1</text>
    <text x="68" y="555" transform="rotate(-90 68 555)">1 : 0..N • usuário responsável</text>
    <text x="990" y="738">1 : N</text>
  </g>
  <g transform="translate(80 80)">
    <rect class="box" width="330" height="220" rx="8"/><path class="head" d="M8 0h314a8 8 0 0 1 8 8v42H0V8a8 8 0 0 1 8-8z"/>
    <text class="headtxt" x="165" y="32" text-anchor="middle">usuarios</text>
    <text class="field" x="18" y="78">PK  id INT</text><text class="field" x="18" y="105">nome, email (único), senha</text>
    <text class="field" x="18" y="132">perfil, ativo, created_at</text><text class="field" x="18" y="170">1 conta → 0 ou 1 cliente</text>
  </g>
  <g transform="translate(570 80)">
    <rect class="box" width="330" height="190" rx="8"/><path class="head" d="M8 0h314a8 8 0 0 1 8 8v42H0V8a8 8 0 0 1 8-8z"/>
    <text class="headtxt" x="165" y="32" text-anchor="middle">categorias</text>
    <text class="field" x="18" y="82">PK  id INT</text><text class="field" x="18" y="110">nome, slug (único)</text>
    <text class="field" x="18" y="138">ativo</text><text class="field" x="18" y="165">1 categoria → N produtos</text>
  </g>
  <g transform="translate(1080 80)">
    <rect class="box" width="350" height="260" rx="8"/><path class="head" d="M8 0h334a8 8 0 0 1 8 8v42H0V8a8 8 0 0 1 8-8z"/>
    <text class="headtxt" x="175" y="32" text-anchor="middle">produtos</text>
    <text class="field" x="18" y="80">PK  id INT</text><text class="field" x="18" y="108">FK  categoria_id → categorias</text>
    <text class="field" x="18" y="136">nome, slug (único), marca</text><text class="field" x="18" y="164">preco, peso, dimensões, estoque</text>
    <text class="field" x="18" y="192">imagem, ativo, created_at</text>
    <text class="field" x="18" y="230">Referenciado por itens e movimentos</text>
  </g>
  <g transform="translate(80 410)">
    <rect class="box" width="330" height="230" rx="8"/><path class="head" d="M8 0h314a8 8 0 0 1 8 8v42H0V8a8 8 0 0 1 8-8z"/>
    <text class="headtxt" x="165" y="32" text-anchor="middle">clientes</text>
    <text class="field" x="18" y="80">PK  id INT</text><text class="field" x="18" y="108">FK  usuario_id → usuarios (único)</text>
    <text class="field" x="18" y="136">nome, cpf, telefone</text><text class="field" x="18" y="164">cep, logradouro, número, complemento</text>
    <text class="field" x="18" y="192">bairro, cidade, uf</text>
  </g>
  <g transform="translate(570 390)">
    <rect class="box" width="400" height="275" rx="8"/><path class="head" d="M8 0h384a8 8 0 0 1 8 8v42H0V8a8 8 0 0 1 8-8z"/>
    <text class="headtxt" x="200" y="32" text-anchor="middle">pedidos</text>
    <text class="field" x="18" y="80">PK  id INT</text><text class="field" x="18" y="108">FK  usuario_id → usuarios</text>
    <text class="field" x="18" y="136">subtotal, frete, total</text><text class="field" x="18" y="164">status, pagamento, created_at</text>
    <text class="field" x="18" y="192">cep_entrega, endereco_entrega</text>
    <text class="field" x="18" y="220">Snapshots do cliente e status_pagamento</text>
    <text class="field" x="18" y="250">1 pedido → N itens; 0 ou 1 nota fiscal</text>
  </g>
  <g transform="translate(1080 420)">
    <rect class="box" width="350" height="200" rx="8"/><path class="head" d="M8 0h334a8 8 0 0 1 8 8v42H0V8a8 8 0 0 1 8-8z"/>
    <text class="headtxt" x="175" y="32" text-anchor="middle">itens_pedido</text>
    <text class="field" x="18" y="82">PK  id INT</text><text class="field" x="18" y="110">FK  pedido_id → pedidos</text>
    <text class="field" x="18" y="138">FK  produto_id → produtos</text><text class="field" x="18" y="166">quantidade, preco_unitario</text>
    <text class="field" x="18" y="190">produto_nome (snapshot)</text>
  </g>
  <g transform="translate(80 810)">
    <rect class="box" width="400" height="200" rx="8"/><path class="head" d="M8 0h384a8 8 0 0 1 8 8v42H0V8a8 8 0 0 1 8-8z"/>
    <text class="headtxt" x="200" y="32" text-anchor="middle">movimentos_estoque</text>
    <text class="field" x="18" y="82">PK  id INT</text><text class="field" x="18" y="110">FK  produto_id → produtos</text>
    <text class="field" x="18" y="138">FK  usuario_id → usuarios (opcional)</text>
    <text class="field" x="18" y="166">tipo, quantidade, observacao, created_at</text>
  </g>
  <g transform="translate(620 810)">
    <rect class="box" width="360" height="180" rx="8"/><path class="head" d="M8 0h344a8 8 0 0 1 8 8v42H0V8a8 8 0 0 1 8-8z"/>
    <text class="headtxt" x="180" y="32" text-anchor="middle">notas_fiscais</text>
    <text class="field" x="18" y="82">PK  id INT</text><text class="field" x="18" y="110">FK  pedido_id → pedidos (único)</text>
    <text class="field" x="18" y="138">numero (único), valor_total</text><text class="field" x="18" y="165">created_at • estrutura não emissora</text>
  </g>
</svg>
