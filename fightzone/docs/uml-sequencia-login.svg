<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1080" role="img" aria-labelledby="title desc">
  <title id="title">UML de sequência: autenticação e direcionamento por perfil</title>
  <desc id="desc">Sequência do envio do login pela interface, validação CSRF, consulta ao usuário, verificação do hash e abertura de sessão de cliente ou equipe.</desc>
  <defs>
    <style>
      .bg{fill:#f4f1eb}.box{fill:#fffefa;stroke:#171816;stroke-width:2}.lifeline{stroke:#92938c;stroke-width:2;stroke-dasharray:8 7}.msg{stroke:#d8432e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.return{stroke:#777870;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#arrowGray)}.title{fill:#171816;font:bold 24px Arial,sans-serif}.head{fill:#171816;font:bold 16px Arial,sans-serif}.text{fill:#252a32;font:16px Arial,sans-serif}.small{fill:#66675f;font:14px Arial,sans-serif}.frame{fill:#fffefa;stroke:#d8432e;stroke-width:2}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d8432e"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#777870"/></marker>
  </defs>
  <rect class="bg" width="900" height="1080" rx="18"/>
  <text class="title" x="450" y="42" text-anchor="middle">UML • Sequência de autenticação</text>
  <g>
    <rect class="box" x="22" y="72" width="146" height="58" rx="8"/><text class="head" x="95" y="107" text-anchor="middle">Navegador</text>
    <rect class="box" x="197" y="72" width="146" height="58" rx="8"/><text class="head" x="270" y="98" text-anchor="middle">ClienteController</text><text class="small" x="270" y="118" text-anchor="middle">interface principal</text>
    <rect class="box" x="372" y="72" width="146" height="58" rx="8"/><text class="head" x="445" y="98" text-anchor="middle">ClienteConta</text><text class="small" x="445" y="118" text-anchor="middle">modelo</text>
    <rect class="box" x="547" y="72" width="146" height="58" rx="8"/><text class="head" x="620" y="107" text-anchor="middle">MySQL</text>
    <rect class="box" x="722" y="72" width="146" height="58" rx="8"/><text class="head" x="795" y="98" text-anchor="middle">Sessão PHP</text><text class="small" x="795" y="118" text-anchor="middle">perfil do usuário</text>
  </g>
  <g class="lifeline">
    <path d="M95 130V1015"/><path d="M270 130V1015"/><path d="M445 130V1015"/><path d="M620 130V1015"/><path d="M795 130V1015"/>
  </g>
  <path class="msg" d="M95 180H270"/><text class="text" x="182" y="168" text-anchor="middle">GET tela de entrada</text>
  <path class="return" d="M270 225H95"/><text class="text" x="182" y="213" text-anchor="middle">formulário com token CSRF</text>
  <path class="msg" d="M95 285H270"/><text class="text" x="182" y="273" text-anchor="middle">POST e-mail, senha e token</text>
  <rect class="frame" x="197" y="310" width="671" height="74" rx="8"/>
  <text class="text" x="213" y="339">Exige POST e compara token; normaliza o e-mail.</text>
  <text class="small" x="213" y="364">Token inválido → HTTP 403 e interrupção da autenticação.</text>
  <path class="msg" d="M270 425H445"/><text class="text" x="357" y="413" text-anchor="middle">buscarPorEmail(email)</text>
  <path class="msg" d="M445 470H620"/><text class="text" x="532" y="458" text-anchor="middle">SELECT parametrizado</text>
  <path class="return" d="M620 515H445"/><text class="text" x="532" y="503" text-anchor="middle">conta / sem resultado</text>
  <path class="return" d="M445 560H270"/><text class="text" x="357" y="548" text-anchor="middle">dados da conta</text>
  <rect class="frame" x="197" y="585" width="671" height="78" rx="8"/>
  <text class="text" x="213" y="615">Confere conta ativa, perfil permitido e password_verify.</text>
  <text class="small" x="213" y="642">Falha: mensagem genérica; não inicia sessão autenticada.</text>
  <path class="msg" d="M270 700H795"/><text class="text" x="532" y="688" text-anchor="middle">regenera ID e grava dados da sessão</text>
  <rect class="frame" x="197" y="735" width="671" height="152" rx="8"/>
  <text class="head" x="215" y="765">alt • perfil cliente</text>
  <text class="text" x="232" y="792">Remove dados de equipe, define cliente_usuario_id</text>
  <text class="text" x="232" y="816">e renova token; redireciona à loja.</text>
  <text class="head" x="215" y="849">perfil admin ou vendedor</text>
  <text class="text" x="232" y="875">Limpa carrinho/sessão cliente; define usuário, papel e nome;</text>
  <path class="return" d="M270 940H95"/><text class="text" x="182" y="928" text-anchor="middle">redirect para loja ou painel</text>
</svg>
