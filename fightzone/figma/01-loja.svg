<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">Protótipo FightZone — loja</title>
  <desc id="desc">Tela desktop da loja FightZone com navegação, destaque de artigos de boxe e cartões de produtos.</desc>
  <defs>
