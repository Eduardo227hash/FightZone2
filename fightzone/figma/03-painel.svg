  <circle cx="1052" cy="555" r="8" fill="#d8432e"/><text class="body" x="1074" y="560">Bandagem Elástica</text><text class="small" x="1342" y="560" text-anchor="end">3 un.</text>
  <circle cx="1052" cy="610" r="8" fill="#d8432e"/><text class="body" x="1074" y="615">Bucal Maximum</text><text class="small" x="1342" y="615" text-anchor="end">4 un.</text>
  <rect x="1036" y="674" width="310" height="48" rx="8" fill="#171816"/>
  <text class="whiteText" x="1191" y="704" text-anchor="middle">Ver produtos</text>
  <text class="small" x="302" y="832">Ambiente demonstrativo • valores de exemplo • sem conexão com dados reais</text>
  <text class="small" x="302" y="970">FIGHTZONE • Protótipo visual para avaliação acadêmica</text>
