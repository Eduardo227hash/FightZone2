  <rect x="806" y="528" width="120" height="27" rx="13" fill="#f8e9e4"/><text x="866" y="546" fill="#a92d20" font-family="Arial" font-size="12" text-anchor="middle">Aguardando</text>
  <text class="body" x="348" y="594">#1047</text><text class="body" x="462" y="594">Carlos Lima</text><text class="body" x="680" y="594">R$ 249,90</text>
