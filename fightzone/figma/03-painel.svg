  <text class="body" x="348" y="642">#1046</text><text class="body" x="462" y="642">Marina Alves</text><text class="body" x="680" y="642">R$ 899,90</text>
  <rect x="806" y="624" width="120" height="27" rx="13" fill="#e7edf5"/><text x="866" y="642" fill="#425b77" font-family="Arial" font-size="12" text-anchor="middle">Separação</text>
  <text class="body" x="348" y="690">#1045</text><text class="body" x="462" y="690">João Santos</text><text class="body" x="680" y="690">R$ 129,90</text>
  <rect x="806" y="672" width="120" height="27" rx="13" fill="#f8e9e4"/><text x="866" y="690" fill="#a92d20" font-family="Arial" font-size="12" text-anchor="middle">Aguardando</text>
