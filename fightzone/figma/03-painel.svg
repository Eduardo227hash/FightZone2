<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">Protótipo FightZone — painel administrativo</title>
  <desc id="desc">Tela de painel com navegação administrativa, indicadores de vendas, pedidos pendentes e estoque baixo.</desc>
  <defs>
    <style>
      .bg{fill:#f4f1eb}.white{fill:#fffefa}.dark{fill:#171816}.side{fill:#20211e}.muted{fill:#777870}.orange{fill:#d8432e}.title{fill:#171816;font:bold 29px Arial,sans-serif}.body{fill:#252a32;font:15px Arial,sans-serif}.small{fill:#777870;font:12px Arial,sans-serif}.sideText{fill:#c1c0b8;font:14px Arial,sans-serif}.active{fill:#fffefa;font:bold 14px Arial,sans-serif}.label{fill:#777870;font:bold 12px Arial,sans-serif;letter-spacing:1px}.value{fill:#171816;font:bold 27px Arial,sans-serif}.whiteText{fill:#fffefa;font:bold 16px Arial,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1440" height="1000"/>
  <rect class="side" width="260" height="1000"/>
  <text x="34" y="58" fill="#fffefa" font-family="Arial" font-size="22" font-weight="bold" letter-spacing="3">FIGHT<tspan fill="#e45a42">ZONE</tspan></text>
  <text x="34" y="103" fill="#777870" font-family="Arial" font-size="11" font-weight="bold" letter-spacing="2">PAINEL DA EQUIPE</text>
  <rect x="18" y="139" width="224" height="49" rx="8" fill="#d8432e"/>
  <text class="active" x="48" y="170">◉  Visão geral</text>
  <text class="sideText" x="48" y="231">▦  Produtos</text>
  <text class="sideText" x="48" y="284">▤  Entradas de estoque</text>
  <text class="sideText" x="48" y="337">▣  Categorias</text>
  <text class="sideText" x="48" y="390">▧  Pedidos</text>
  <text class="sideText" x="48" y="443">▥  Relatórios</text>
  <line x1="30" y1="910" x2="230" y2="910" stroke="#42433d"/>
  <text class="sideText" x="48" y="953">↪  Sair</text>
